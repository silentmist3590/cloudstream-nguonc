name: Build CloudStream Plugins

permissions:
  contents: write

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Plugins (.cs3)
        run: |
          gradle make makePluginsJson || true

      - name: Deploy to builds branch
        run: |
          mkdir -p output
          cd output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b builds

          # Copy files
          find .. -name "*.cs3" -exec cp {} ./ \; 2>/dev/null || true
          find .. -name "plugins.json" -exec cp {} ./ \; 2>/dev/null || true
          if [ -f "../repo.json" ]; then
            cp ../repo.json ./
          fi

          git add -A
          git commit -m "Auto Build CloudStream Plugins [skip ci]" || exit 0
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git builds
